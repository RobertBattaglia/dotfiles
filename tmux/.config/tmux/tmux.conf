set -g default-terminal xterm-256color
set -as terminal-features ',xterm-256color:RGB'

# No delay esc
set -sg escape-time 0

set -g mouse on

# Start numbering at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Status bar
set -g status-position top
set -g status-interval 2
setw -g status-left " #{session_name} "
setw -g status-left-style "fg=black bg=white"
set -g status-right-length 100
setw -g status-right "#(~/.local/bin/claude-threads-tick)#{host}"
setw -g status-right-style "fg=white bg=black"
# Claude Code windows (options set by the claude-tmux-state hook and claude-threads):
#   purple = running, amber = needs approval / question, green = done, red = failed (API error),
#   gray = snoozed (marked z, or z! if Claude finished meanwhile), dim = settled. ^ = pinned, [K] = tree shortcut key.
# Precedence: approval > settled > snoozed > failed > done > running (approvals break through snooze).
set -g @claude_running_style  "fg=#ffffff bg=#7c3aed nodim"
set -g @claude_approval_style "fg=#1c1917 bg=#f59e0b bold nodim"
set -g @claude_done_style     "fg=#ffffff bg=#15803d nodim"
set -g @claude_failed_style   "fg=#ffffff bg=#b91c1c bold nodim"
set -g @claude_snoozed_style  "fg=#d1d5db bg=#374151 nodim"
set -g @claude_settled_style  "fg=#6b7280 dim"
set -g @claude_window_style '#{?#{==:#{@claude_outcome},needs_approval},#{@claude_approval_style},#{?@claude_settled,#{@claude_settled_style},#{?@claude_snoozed,#{@claude_snoozed_style},#{?#{==:#{@claude_outcome},failed},#{@claude_failed_style},#{?#{==:#{@claude_outcome},done},#{@claude_done_style},#{?@claude_running,#{@claude_running_style},}}}}}}'
set -g @claude_window_markers '#{?@claude_pinned,^,}#{?@claude_snoozed,z#{?@claude_snooze_news,!,} ,}'
setw -g window-status-current-format " #{E:@claude_window_markers}#{?@tree_key,[#{@tree_key}] ,}#{window_index}:#{window_name} "
setw -g window-status-current-style "fg=black bg=cyan dim"
setw -g window-status-format "#{?#{E:@claude_window_style},#[#{E:@claude_window_style}],}#{E:@claude_window_markers}#{?@tree_key,[#{@tree_key}] ,}#I:#W#{?window_flags,#{window_flags}, }"
set -g status-style "fg=white bg=black dim"
set -g status-justify left
set -g message-style "fg=white bg=black bold"

# Bindings

unbind f

bind r source-file ~/.config/tmux/tmux.conf \; display ".tmux.conf reloaded!" # reload config file
bind Tab switch-client -l
bind j switch-client -n
bind k switch-client -p
bind f display-popup -E "tmux-sessionizer"
bind space display-popup -E -w 90% -h 80% "tmux-windowizer '#{session_id}' '#{pane_current_path}'"
bind-key t command-prompt -p "Swap window with:" "swap-window -d -t '%%'"


# Tree view (default format) with Claude windows highlighted; W shows only Claude windows that are running or your turn
# (not settled, not snoozed unless awaiting approval)
bind w choose-tree -Zw -K '#{?#{&&:#{window_format},#{@tree_key}},#{@tree_key},#{?#{e|<:#{line},10},#{line},#{?#{e|<:#{line},36},M-#{a:#{e|+:#{e|-:#{line},10},97}},}}}' -F '#{?pane_format,#{?pane_marked,#[reverse],}#{pane_current_command}#{?pane_active,*,}#{?pane_marked,M,}#{?#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}},: "#{pane_title}",},#{?window_format,#{?#{E:@claude_window_style},#[#{E:@claude_window_style}],}#{E:@claude_window_markers}#{?window_marked_flag,#[reverse],}#{window_name}#{window_flags}#{?#{&&:#{==:#{window_panes},1},#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}}},: "#{pane_title}",},#{session_windows} windows#{?session_grouped, (group #{session_group}: #{session_group_list}),}#{?session_attached, (attached),}}}'
bind W choose-tree -Zw -f '#{&&:#{||:#{@claude_waiting},#{@claude_running}},#{&&:#{!:#{@claude_settled}},#{||:#{!:#{@claude_snoozed}},#{==:#{@claude_outcome},needs_approval}}}}' -K '#{?#{&&:#{window_format},#{@tree_key}},#{@tree_key},#{?#{e|<:#{line},10},#{line},#{?#{e|<:#{line},36},M-#{a:#{e|+:#{e|-:#{line},10},97}},}}}' -F '#{?pane_format,#{?pane_marked,#[reverse],}#{pane_current_command}#{?pane_active,*,}#{?pane_marked,M,}#{?#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}},: "#{pane_title}",},#{?window_format,#{?#{E:@claude_window_style},#[#{E:@claude_window_style}],}#{E:@claude_window_markers}#{?window_marked_flag,#[reverse],}#{window_name}#{window_flags}#{?#{&&:#{==:#{window_panes},1},#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}}},: "#{pane_title}",},#{session_windows} windows#{?session_grouped, (group #{session_group}: #{session_group_list}),}#{?session_attached, (attached),}}}'
# Shortcut key for the current window in the <prefix>w tree view (via -K); empty input clears it.
# Avoid tree-mode command keys (j k q x t f v O r / :) -- capital letters are safest. Replaces default display-panes.
bind q command-prompt -I "#{@tree_key}" -p "Tree key for this window (empty clears):" { set -w @tree_key "%%" ; run-shell -b "claude-threads remember-tree-key '#{window_id}'" }
# Manually clear the Claude highlights (running / approval / done / failed): a = current window, A = all windows
bind a set -wu @claude_waiting \; set -wu @claude_running \; set -wu @claude_outcome \; set -wu @claude_pending_approval_tool
bind A run-shell "tmux list-windows -a -F '##{window_id}' | xargs -I{} sh -c 'for option in @claude_waiting @claude_running @claude_outcome @claude_pending_approval_tool; do tmux set -wu -t {} \$option; done'"

# Claude threads (claude-threads; state survives closing the window, keyed by Claude session id)
# b = pin/unpin (label defaults to Claude's task summary), B = pinned picker (reopens closed threads via claude --resume)
bind b if -F '#{@claude_pinned}' "run-shell \"claude-threads unpin '#{window_id}'\"" \
  "command-prompt -I '#{pane_title}' -p 'Pin label:' { run-shell \"claude-threads pin '#{window_id}' --label '%%'\" }"
bind B display-popup -E -w 90% -h 70% "claude-threads pinned"
# Z = snooze (30m 2h 14:30 9am tomorrow mon tonight; empty or 'wake' wakes)
bind Z command-prompt -p "#{?@claude_snoozed,Snoozed until #{@claude_snoozed_label}. New time or 'wake':,Snooze (30m 2h 14:30 tomorrow mon; empty=wake):}" \
  { run-shell "claude-threads snooze '#{window_id}' '%%'" }
# S = settle (done with it; keeps window), X = settle and kill window
bind S run-shell "claude-threads settle '#{window_id}'"
bind X confirm-before -p "Settle Claude thread and kill window? (y/n)" "run-shell \"claude-threads settle '#{window_id}' --kill\""
# Reconcile the registry (closed sessions, backfill, auto-settle) when a client attaches, at most every 30 min
set-hook -g client-attached 'run-shell -b "claude-threads sweep --if-older-than 1800"'
