set -g default-terminal xterm-256color
set -as terminal-features ',xterm-256color:RGB'

# No delay esc
set -sg escape-time 0

set -g mouse on

# Start numbering at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Status bar
set -g status-position top
set -g status-interval 2
setw -g status-left " #{session_name} "
setw -g status-left-style "fg=black bg=white"
set -g status-right-length 100
setw -g status-right "#(~/.local/bin/claude-threads-tick)#{host}"
setw -g status-right-style "fg=white bg=black"
# Claude Code windows (options set by the claude-tmux-state hook and claude-threads):
#   purple = running, amber = needs approval / question, green = done, red = failed (API error),
#   gray = snoozed (marked z, or z! if Claude finished meanwhile), dim = settled. ^ = pinned, [K] = tree shortcut key.
# Precedence: approval > settled > snoozed > failed > done > running (approvals break through snooze).
set -g @claude_running_style  "fg=#ffffff bg=#7c3aed nodim"
set -g @claude_approval_style "fg=#1c1917 bg=#f59e0b bold nodim"
set -g @claude_done_style     "fg=#ffffff bg=#15803d nodim"
set -g @claude_failed_style   "fg=#ffffff bg=#b91c1c bold nodim"
set -g @claude_snoozed_style  "fg=#d1d5db bg=#374151 nodim"
set -g @claude_settled_style  "fg=#6b7280 dim"
set -g @claude_window_style '#{?#{==:#{@claude_outcome},needs_approval},#{@claude_approval_style},#{?@claude_settled,#{@claude_settled_style},#{?@claude_snoozed,#{@claude_snoozed_style},#{?#{==:#{@claude_outcome},failed},#{@claude_failed_style},#{?#{==:#{@claude_outcome},done},#{@claude_done_style},#{?@claude_running,#{@claude_running_style},}}}}}}'
set -g @claude_window_markers '#{?@claude_pinned,^,}#{?@claude_snoozed,z#{?@claude_snooze_news,!,} ,}'
setw -g window-status-current-format " #{E:@claude_window_markers}#{window_index}:#{window_name} "
setw -g window-status-current-style "fg=black bg=cyan dim"
setw -g window-status-format "#{?#{E:@claude_window_style},#[#{E:@claude_window_style}],}#{E:@claude_window_markers}#I:#W#{?window_flags,#{window_flags}, }"
set -g status-style "fg=white bg=black dim"
set -g status-justify left
set -g message-style "fg=white bg=black bold"

# Bindings

unbind f

bind -N "Reload tmux config" r source-file ~/.config/tmux/tmux.conf \; display ".tmux.conf reloaded!" # reload config file
bind -N "Switch to the last session" Tab switch-client -l
bind -N "Switch to the next session" j switch-client -n
bind -N "Switch to the previous session" k switch-client -p
bind -N "Sessionizer: switch to or create a session for a directory" f display-popup -E "tmux-sessionizer"
bind -N "Windowizer: find a window in any session" space display-popup -E -w 90% -h 80% "tmux-windowizer '#{session_id}'"
bind -N "Split window vertically (keeps the directory)" '"' split-window -v -c "#{pane_current_path}"
bind -N "Split window horizontally (keeps the directory)" % split-window -h -c "#{pane_current_path}"
# G = side-by-side pane reviewing everything since branching from origin's default branch (committed + uncommitted):
# one tab per changed file, vdiff of merge-base vs working tree (gt/gT to move between files; pane closes when nvim quits)
bind -N "Review this branch's diff in nvim (side pane)" G split-window -h -c "#{pane_current_path}" 'nvim -c "Git difftool -y --ignore-submodules $(git merge-base origin/HEAD HEAD)" -c "1tabclose"'


# Tree view (default format) with Claude windows highlighted
bind -N "Choose a window from a list (Claude windows coloured)" w choose-tree -Zw -F '#{?pane_format,#{?pane_marked,#[reverse],}#{pane_current_command}#{?pane_active,*,}#{?pane_marked,M,}#{?#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}},: "#{pane_title}",},#{?window_format,#{?#{E:@claude_window_style},#[#{E:@claude_window_style}],}#{E:@claude_window_markers}#{?window_marked_flag,#[reverse],}#{window_name}#{window_flags}#{?#{&&:#{==:#{window_panes},1},#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}}},: "#{pane_title}",},#{session_windows} windows#{?session_grouped, (group #{session_group}: #{session_group_list}),}#{?session_attached, (attached),}}}'

# Claude threads (claude-threads; state survives closing the window, keyed by Claude session id)
# Key case: pickers are lowercase (i, w, f, Space); actions on the current Claude thread are uppercase (T Z S X R),
# which keeps the lowercase tmux defaults (z zoom, s sessions, x kill-pane, t clock).
# T = pin / unpin this window's thread, same as ctrl-t in the inbox (label defaults to Claude's task summary;
# edit it with ctrl-e in the inbox's pinned view). Replaces the default "change the pane title" (Claude sets it).
bind -N "Claude: pin / unpin this thread" T run-shell "claude-threads toggle-pin '#{window_id}'"
# Z = snooze, pre-filled with the last snooze you used (4h the first time): Enter repeats it; 'wake' wakes
bind -N "Claude: snooze this thread (Enter repeats the last snooze)" Z run-shell "claude-threads snooze-prompt '#{window_id}' '#{client_name}'"
# S = settle after y/n (done with it; keeps window), or unsettle if already settled; X = settle and kill window
bind -N "Claude: settle this thread (y/n), or unsettle it" S if -F '#{@claude_settled}' {
  run-shell "claude-threads unsettle '#{window_id}'"
} {
  confirm-before -p "Settle this Claude thread? (y/n)" { run-shell "claude-threads settle '#{window_id}'" }
}
bind -N "Claude: settle this thread and kill the window (y/n)" X confirm-before -p "Settle Claude thread and kill window? (y/n)" "run-shell \"claude-threads settle '#{window_id}' --kill\""
# i = inbox over the registry, including closed threads. Views (tab / shift-tab): inbox, pinned, snoozed, settled.
# Enter opens/resumes; ctrl-s settle (y/n) or unsettle, ctrl-z snooze, ctrl-t pin, ctrl-e label. i replaces display-message.
bind -N "Claude: inbox (tab cycles inbox / pinned / snoozed / settled)" i display-popup -E -w 90% -h 80% "claude-threads inbox --session '#{session_id}'"
# R = restore windows from the last snapshot of a tmux server that's gone (reboot / kill-server): Claude threads resume
# with their launch flags, other windows come back as shells in their directory. Lists the plan and asks y/n first.
bind -N "Claude: restore windows after a reboot / tmux restart" R display-popup -E -w 90% -h 80% "claude-threads restore --pause"
# On attach: reconcile the registry (closed sessions, backfill, auto-settle) at most every 30 min,
# and say so if there's a previous server's windows to restore
set-hook -g client-attached 'run-shell -b "claude-threads sweep --if-older-than 1800; claude-threads restore --hint"'
