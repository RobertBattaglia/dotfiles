set -g default-terminal xterm-256color
set -as terminal-features ',xterm-256color:RGB'

# No delay esc
set -sg escape-time 0

set -g mouse on

# Start numbering at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Status bar
set -g status-position top
set -g status-interval 2
setw -g status-left " #{session_name} "
setw -g status-left-style "fg=black bg=white"
set -g status-right-length 100
setw -g status-right "#{host}"
setw -g status-right-style "fg=white bg=black"
setw -g window-status-current-format " #{?@tree_key,[#{@tree_key}] ,}#{window_index}:#{window_name} "
setw -g window-status-current-style "fg=black bg=cyan dim"
# Highlight Claude Code windows (options set by Claude hooks): red = waiting for input, purple = agent running.
# Waiting takes precedence if both are somehow set. A window's tree shortcut (@tree_key, set via <prefix>q) shows as [K].
set -g @claude_waiting_style "fg=#ffffff bg=#b91c1c bold nodim"
set -g @claude_running_style "fg=#ffffff bg=#7c3aed nodim"
setw -g window-status-format "#{?@claude_waiting,#[#{@claude_waiting_style}],#{?@claude_running,#[#{@claude_running_style}],}}#{?@tree_key,[#{@tree_key}] ,}#I:#W#{?window_flags,#{window_flags}, }"
set -g status-style "fg=white bg=black dim"
set -g status-justify left
set -g message-style "fg=white bg=black bold"

# Bindings

unbind f

bind r source-file ~/.config/tmux/tmux.conf \; display ".tmux.conf reloaded!" # reload config file
bind Tab switch-client -l
bind j switch-client -n
bind k switch-client -p
bind f display-popup -E "tmux-sessionizer"
bind space display-popup -E -w 90% -h 80% "tmux-windowizer '#{session_id}' '#{pane_current_path}'"
bind-key t command-prompt -p "Swap window with:" "swap-window -d -t '%%'"


# Tree view (default format) with Claude waiting/running windows highlighted; W shows only those Claude windows (same format)
bind w choose-tree -Zw -K '#{?#{&&:#{window_format},#{@tree_key}},#{@tree_key},#{?#{e|<:#{line},10},#{line},#{?#{e|<:#{line},36},M-#{a:#{e|+:#{e|-:#{line},10},97}},}}}' -F '#{?pane_format,#{?pane_marked,#[reverse],}#{pane_current_command}#{?pane_active,*,}#{?pane_marked,M,}#{?#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}},: "#{pane_title}",},#{?window_format,#{?@claude_waiting,#[#{@claude_waiting_style}],#{?@claude_running,#[#{@claude_running_style}],}}#{?window_marked_flag,#[reverse],}#{window_name}#{window_flags}#{?#{&&:#{==:#{window_panes},1},#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}}},: "#{pane_title}",},#{session_windows} windows#{?session_grouped, (group #{session_group}: #{session_group_list}),}#{?session_attached, (attached),}}}'
bind W choose-tree -Zw -f '#{||:#{@claude_waiting},#{@claude_running}}' -K '#{?#{&&:#{window_format},#{@tree_key}},#{@tree_key},#{?#{e|<:#{line},10},#{line},#{?#{e|<:#{line},36},M-#{a:#{e|+:#{e|-:#{line},10},97}},}}}' -F '#{?pane_format,#{?pane_marked,#[reverse],}#{pane_current_command}#{?pane_active,*,}#{?pane_marked,M,}#{?#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}},: "#{pane_title}",},#{?window_format,#{?@claude_waiting,#[#{@claude_waiting_style}],#{?@claude_running,#[#{@claude_running_style}],}}#{?window_marked_flag,#[reverse],}#{window_name}#{window_flags}#{?#{&&:#{==:#{window_panes},1},#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}}},: "#{pane_title}",},#{session_windows} windows#{?session_grouped, (group #{session_group}: #{session_group_list}),}#{?session_attached, (attached),}}}'
# Shortcut key for the current window in the <prefix>w tree view (via -K); empty input clears it.
# Avoid tree-mode command keys (j k q x t f v O r / :) -- capital letters are safest. Replaces default display-panes.
bind q command-prompt -I "#{@tree_key}" -p "Tree key for this window (empty clears):" { set -w @tree_key "%%" }
# Manually clear the Claude highlights (waiting + running): a = current window, A = all windows
bind a set -wu @claude_waiting \; set -wu @claude_running
bind A run-shell "tmux list-windows -a -F '##{window_id}' | xargs -I{} sh -c 'tmux set -wu -t {} @claude_waiting; tmux set -wu -t {} @claude_running'"
