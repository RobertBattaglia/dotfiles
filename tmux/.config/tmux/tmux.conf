set -g default-terminal xterm-256color
set -as terminal-features ',xterm-256color:RGB'

# No delay esc
set -sg escape-time 0

set -g mouse on

# Start numbering at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Status bar
set -g status-position top
set -g status-interval 2
setw -g status-left " #{session_name} "
setw -g status-left-style "fg=black bg=white"
set -g status-right-length 100
setw -g status-right "#{host}"
setw -g status-right-style "fg=white bg=black"
setw -g window-status-current-format " #{window_index}:#{window_name} "
setw -g window-status-current-style "fg=black bg=cyan dim"
# Highlight windows where Claude Code is waiting for input (@claude_waiting set by Claude hooks)
set -g @claude_waiting_style "fg=#ffffff bg=#b91c1c bold nodim"
setw -g window-status-format "#{?@claude_waiting,#[#{@claude_waiting_style}],}#I:#W#{?window_flags,#{window_flags}, }"
set -g status-style "fg=white bg=black dim"
set -g status-justify left
set -g message-style "fg=white bg=black bold"

# Bindings

unbind f

bind r source-file ~/.config/tmux/tmux.conf \; display ".tmux.conf reloaded!" # reload config file
bind Tab last-window
bind BTab switch-client -l
bind j switch-client -n
bind k switch-client -p
bind f display-popup -E "tmux-sessionizer"
bind-key t command-prompt -p "Swap window with:" "swap-window -d -t '%%'"


# Tree view (default format) with Claude-waiting windows highlighted; W shows only those windows
bind w choose-tree -Zw -F '#{?pane_format,#{?pane_marked,#[reverse],}#{pane_current_command}#{?pane_active,*,}#{?pane_marked,M,}#{?#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}},: "#{pane_title}",},#{?window_format,#{?@claude_waiting,#[#{@claude_waiting_style}],}#{?window_marked_flag,#[reverse],}#{window_name}#{window_flags}#{?#{&&:#{==:#{window_panes},1},#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}}},: "#{pane_title}",},#{session_windows} windows#{?session_grouped, (group #{session_group}: #{session_group_list}),}#{?session_attached, (attached),}}}'
bind W choose-tree -Zw -f '#{@claude_waiting}'
# Manually clear the Claude-waiting highlight: a = current window, A = all windows
bind a set -wu @claude_waiting
bind A run-shell "tmux list-windows -a -F '##{window_id}' | xargs -I{} tmux set -wu -t {} @claude_waiting"
